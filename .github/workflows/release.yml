name: Release

# On a version tag: build the disk image and zip and attach them to the GitHub release.
# Files already attached (e.g. uploaded by hand) are kept, so the Homebrew checksum stays valid.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build
        run: scripts/build-app.sh --dmg
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Screenshooter $version" --notes "See the README for what's new."
          existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for file in "dist/Screenshooter-$version.dmg" "dist/Screenshooter-$version.zip"; do
            if echo "$existing" | grep -qx "$(basename "$file")"; then
              echo "$(basename "$file") is already attached — keeping it"
            else
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done
